<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>DearLove 멤버십</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!--
    앱 안 웹뷰에서 여는 멤버십 페이지(앱 docs/membership.md).
    가격은 앱이 스토어에서 받아 넘겨 준 현지 가격만 보이고, 가입·복원·구독 관리는 앱이 스토어 결제로 한다.
    앱 → 페이지: window.dearlove.receive({type:"state"|"result", ...})
    페이지 → 앱: Android window.DearLoveApp.postMessage(json), iOS window.webkit.messageHandlers.dearlove.postMessage(json)
    색과 글자는 앱 디자인 시스템(designSystem/src/theme)과 같다.
  -->
  <style>
    :root {
      --paper: #FFFDF7; --card: #FBF6EA; --letter: #FFF9EA; --line: #DDD4C2;
      --ink: #221E16; --ink2: #5C5240; --ink3: #746A58;
      --brand: #FFE58A; --on-brand: #2E2300; --brand-subtle: #FFF6D6; --brand-border: #FFD95E; --honey: #8A6400;
      --love: #C0304F; --disabled-bg: rgba(34,30,22,.12); --disabled: #B0A692;
    }
    :root.dark {
      --paper: #16130D; --card: #1F1B13; --letter: #2B2519; --line: #4A4336;
      --ink: #EDE6D8; --ink2: #CFC6B4; --ink3: #B3A994;
      --brand: #FFE58A; --on-brand: #2E2300; --brand-subtle: #3A3110; --brand-border: #B88700; --honey: #FFE58A;
      --love: #FF8FA6; --disabled-bg: rgba(237,230,216,.12); --disabled: #6E6555;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 16px/1.5 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 24px; line-height: 32px; letter-spacing: -0.02em; margin: 8px 0 4px; }
    h2 { font-size: 15px; line-height: 22px; margin: 24px 0 8px; color: var(--ink2); }
    p { margin: 0; }
    .lead { color: var(--ink2); font-size: 15px; }
    .stamp {
      width: 64px; height: 64px; border-radius: 16px; background: var(--brand); display: grid; place-items: center;
      font-size: 30px; margin-top: 8px;
      -webkit-mask: radial-gradient(circle 3.5px at 50% 0, #0000 98%, #000) 0 0/14px 51% repeat-x,
                    radial-gradient(circle 3.5px at 50% 100%, #0000 98%, #000) 0 100%/14px 51% repeat-x;
    }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    .status { background: var(--brand-subtle); border-color: var(--brand-border); margin-top: 16px; }
    .status b { color: var(--on-brand); }
    :root.dark .status b { color: var(--brand); }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 10px 4px; text-align: left; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    th { font-size: 12px; color: var(--ink3); font-weight: 500; }
    td.v { text-align: right; white-space: nowrap; }
    td.plus { font-weight: 700; color: var(--honey); }
    .soon { color: var(--ink3); font-size: 14px; margin: 8px 0 0; padding-left: 18px; }
    .plans { display: grid; gap: 8px; }
    .plan {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit;
      background: var(--letter); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer;
    }
    .plan[aria-checked="true"] { background: var(--brand-subtle); border: 2px solid var(--brand-border); padding: 13px 15px; }
    .plan .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink3); flex: none; }
    .plan[aria-checked="true"] .dot { border: 6px solid var(--honey); }
    .plan .name { font-weight: 600; flex: 1; }
    .plan .tag { font-size: 11px; font-weight: 600; background: var(--brand); color: var(--on-brand); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
    .plan .price { font-weight: 700; }
    button.primary, button.secondary, button.text {
      font-family: inherit; font-size: 15px; line-height: 20px; font-weight: 600; width: 100%; min-height: 48px; border-radius: 999px; cursor: pointer;
    }
    button.primary { background: var(--brand); color: var(--on-brand); border: 0; margin-top: 16px; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--ink3); margin-top: 8px; }
    button.text { background: transparent; color: var(--honey); border: 0; }
    button:disabled { background: var(--disabled-bg); color: var(--disabled); border-color: transparent; cursor: default; }
    button:active:not(:disabled), .plan:active { filter: brightness(.94); }
    .fine { color: var(--ink3); font-size: 12px; line-height: 18px; margin-top: 16px; }
    .fine a { color: var(--ink2); }
    .toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
      background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 16px; font-size: 14px;
      opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="stamp" aria-hidden="true">💌</div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <section class="card status" id="status" hidden>
    <p><b data-t="active"></b></p>
    <p class="lead" id="statusLine"></p>
  </section>

  <h2 data-t="benefits"></h2>
  <section class="card">
    <table>
      <thead><tr><th></th><th class="v" data-t="free"></th><th class="v" data-t="membership"></th></tr></thead>
      <tbody>
        <tr><td data-t="photos"></td><td class="v" id="freePhotos"></td><td class="v plus" id="plusPhotos"></td></tr>
        <tr><td data-t="videos"></td><td class="v" id="freeVideos"></td><td class="v plus" id="plusVideos"></td></tr>
        <tr><td data-t="upDaily"></td><td class="v" id="freeDaily"></td><td class="v plus" data-t="unlimited"></td></tr>
        <tr><td data-t="upMonthly"></td><td class="v" id="freeMonthly"></td><td class="v plus" data-t="unlimited"></td></tr>
        <tr><td data-t="videoSize"></td><td class="v">100MB</td><td class="v plus">300MB</td></tr>
        <tr><td data-t="both"></td><td class="v">—</td><td class="v plus">✓</td></tr>
      </tbody>
    </table>
    <p class="fine" style="margin-top:12px" data-t="soonTitle"></p>
    <ul class="soon" id="soon"></ul>
  </section>

  <div id="buy">
    <h2 data-t="choose"></h2>
    <div class="plans" role="radiogroup" id="plans"></div>
    <button class="primary" id="purchase" type="button" data-t="join"></button>
  </div>

  <button class="secondary" id="manage" type="button" data-t="manage" hidden></button>
  <button class="text" id="restore" type="button" data-t="restore"></button>
  <p class="lead" id="outside" hidden data-t="outside"></p>

  <p class="fine" id="fine"></p>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // 앱 RecordRules와 같은 한도. 혜택을 바꾸면 앱·서버(records 트리거)·이 표를 함께 바꾼다.
    const LIMITS = { freePhotos: 3, plusPhotos: 30, freeVideos: 1, plusVideos: 5, dayPhotos: 3, dayVideos: 1, monthPhotos: 30, monthVideos: 10 };
    const PRODUCTS = ["dearlove.membership.yearly", "dearlove.membership.monthly"];

    // 용어는 앱 docs/glossary.md를 따른다(멤버십, 우표첩, 추억, 가입 중).
    const T = {
      ko: {
        upDaily: "하루 올리기", upMonthly: "한 달 올리기", videoSize: "동영상 파일 크기", unlimited: "제한 없음", pv: "사진 {p} · 동영상 {v}",
        title: "디어러브 멤버십", lead: "한 사람이 가입하면 커플 우표첩의 두 사람이 함께 써요.",
        active: "멤버십 가입 중", benefits: "멤버십 혜택", free: "무료", membership: "멤버십",
        photos: "추억 하나의 사진", videos: "추억 하나의 동영상", both: "커플 두 사람 모두",
        photoN: "{n}장", videoN: "{n}개", soonTitle: "준비 중인 혜택 (가입하면 나오는 대로 받아요)",
        soon: ["원본 화질 보관", "추억을 책(PDF)으로 내보내기", "우표 테마"],
        choose: "기간 고르기", yearly: "1년", monthly: "1개월", best: "추천", perYear: "/ 년", perMonth: "/ 월",
        join: "멤버십 가입하기", joining: "가입하는 중…", manage: "구독 관리", restore: "구매 복원",
        outside: "멤버십은 DearLove 앱의 설정 > 멤버십에서 가입할 수 있어요.",
        noStore: "스토어에 연결하지 못했어요. 잠시 뒤 다시 열어 주세요.",
        until: "{date}까지", renews: "{date}에 자동으로 갱신돼요.", ends: "{date}에 끝나요(갱신 안 함).",
        byPartner: "상대가 가입한 멤버십이에요.",
        done: "멤버십에 가입했어요. 고마워요!", restored: "구매를 복원했어요.", nothing: "복원할 구독이 없어요.",
        failed: "결제를 확인하지 못했어요. 다시 시도해 주세요.", cancelled: "결제를 취소했어요.",
        fine: "구독은 {store} 계정으로 결제되고, 기간이 끝나기 24시간 전까지 해지하지 않으면 같은 기간·가격으로 자동 갱신돼요. 해지와 환불은 {store}의 구독 관리에서 할 수 있어요. 첫 가입 무료 체험이 있으면 결제 화면에 함께 보여요.",
        terms: "이용약관", privacy: "개인정보처리방침",
      },
      en: {
        upDaily: "Uploads per day", upMonthly: "Uploads per month", videoSize: "Video file size", unlimited: "No limit", pv: "Photos {p} · Videos {v}",
        title: "DearLove Membership", lead: "One person joins, and both of you in your couple stamp book get it.",
        active: "Membership active", benefits: "What you get", free: "Free", membership: "Membership",
        photos: "Photos per memory", videos: "Videos per memory", both: "Both of you as a couple",
        photoN: "{n}", videoN: "{n}", soonTitle: "Coming soon (members get them as they arrive)",
        soon: ["Original-quality storage", "Export memories as a book (PDF)", "Stamp themes"],
        choose: "Choose a plan", yearly: "1 year", monthly: "1 month", best: "Best value", perYear: "/ year", perMonth: "/ month",
        join: "Join Membership", joining: "Joining…", manage: "Manage subscription", restore: "Restore purchases",
        outside: "You can join Membership in the DearLove app under Settings > Membership.",
        noStore: "Couldn’t reach the store. Please open this page again in a moment.",
        until: "Until {date}", renews: "Renews automatically on {date}.", ends: "Ends on {date} (won’t renew).",
        byPartner: "Your partner’s membership.",
        done: "You’ve joined Membership. Thank you!", restored: "Purchases restored.", nothing: "No subscription to restore.",
        failed: "We couldn’t confirm the payment. Please try again.", cancelled: "Payment cancelled.",
        fine: "Paid with your {store} account. It renews automatically for the same period and price unless cancelled at least 24 hours before the period ends. Cancel or request a refund in {store} subscription settings. Any free trial for first-time members is shown at checkout.",
        terms: "Terms of Use", privacy: "Privacy Policy",
      },
      ja: {
        upDaily: "1日のアップロード", upMonthly: "1か月のアップロード", videoSize: "動画のファイルサイズ", unlimited: "上限なし", pv: "写真{p} · 動画{v}",
        title: "DearLove メンバーシップ", lead: "ひとりが加入すると、カップルの切手帳のふたりが一緒に使えます。",
        active: "メンバーシップ加入中", benefits: "メンバーシップの特典", free: "無料", membership: "メンバーシップ",
        photos: "思い出ひとつの写真", videos: "思い出ひとつの動画", both: "カップルのふたりとも",
        photoN: "{n}枚", videoN: "{n}本", soonTitle: "準備中の特典（加入中なら順次使えます）",
        soon: ["元の画質で保存", "思い出を本（PDF）に書き出す", "切手のテーマ"],
        choose: "期間を選ぶ", yearly: "1年", monthly: "1か月", best: "おすすめ", perYear: "/ 年", perMonth: "/ 月",
        join: "メンバーシップに加入", joining: "加入中…", manage: "サブスクリプションの管理", restore: "購入を復元",
        outside: "メンバーシップは DearLove アプリの 設定 > メンバーシップ から加入できます。",
        noStore: "ストアに接続できませんでした。しばらくしてからもう一度開いてください。",
        until: "{date}まで", renews: "{date}に自動更新されます。", ends: "{date}に終了します（更新しない）。",
        byPartner: "相手が加入したメンバーシップです。",
        done: "メンバーシップに加入しました。ありがとうございます！", restored: "購入を復元しました。", nothing: "復元できるサブスクリプションがありません。",
        failed: "決済を確認できませんでした。もう一度お試しください。", cancelled: "決済をキャンセルしました。",
        fine: "{store} アカウントで決済され、期間終了の24時間前までに解約しない限り、同じ期間・価格で自動更新されます。解約と返金は {store} のサブスクリプション管理から行えます。初回の無料体験がある場合は決済画面に表示されます。",
        terms: "利用規約", privacy: "プライバシーポリシー",
      },
      "zh-CN": {
        upDaily: "每天上传", upMonthly: "每月上传", videoSize: "视频文件大小", unlimited: "不限", pv: "照片 {p} · 视频 {v}",
        title: "DearLove 会员", lead: "一个人开通，情侣集邮册里的两个人都能用。",
        active: "会员已开通", benefits: "会员权益", free: "免费", membership: "会员",
        photos: "每条回忆的照片", videos: "每条回忆的视频", both: "情侣两人共享",
        photoN: "{n} 张", videoN: "{n} 个", soonTitle: "即将推出（会员上线后即可使用）",
        soon: ["原图画质保存", "把回忆导出成书（PDF）", "邮票主题"],
        choose: "选择期限", yearly: "1 年", monthly: "1 个月", best: "推荐", perYear: "/ 年", perMonth: "/ 月",
        join: "开通会员", joining: "正在开通…", manage: "管理订阅", restore: "恢复购买",
        outside: "可在 DearLove 应用的 设置 > 会员 中开通。",
        noStore: "无法连接商店。请稍后再打开此页面。",
        until: "有效期至 {date}", renews: "将于 {date} 自动续订。", ends: "将于 {date} 结束（不再续订）。",
        byPartner: "这是对方开通的会员。",
        done: "已开通会员，谢谢！", restored: "已恢复购买。", nothing: "没有可恢复的订阅。",
        failed: "无法确认付款，请重试。", cancelled: "已取消付款。",
        fine: "通过 {store} 账户付款。除非在当期结束前至少 24 小时取消，否则将按相同期限和价格自动续订。可在 {store} 的订阅管理中取消或申请退款。首次开通如有免费试用，会在付款页面显示。",
        terms: "使用条款", privacy: "隐私政策",
      },
    };

    const params = new URLSearchParams(location.search);
    const lang = T[params.get("lang")] ? params.get("lang") : "ko";
    const t = T[lang];
    const platform = params.get("platform") === "ios" ? "ios" : "android";
    const store = platform === "ios" ? "App Store" : "Google Play";
    if (params.get("theme") === "dark" || (!params.get("theme") && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
    document.documentElement.lang = lang;
    document.title = t.title;
    const $ = (id) => document.getElementById(id);
    // 앱과 이야기하기
    const toApp = (msg) => {
      const json = JSON.stringify(msg);
      if (window.DearLoveApp) window.DearLoveApp.postMessage(json);
      else if (window.webkit?.messageHandlers?.dearlove) window.webkit.messageHandlers.dearlove.postMessage(json);
    };
    const inApp = !!(window.DearLoveApp || window.webkit?.messageHandlers?.dearlove);

    const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    $("freePhotos").textContent = fill(t.photoN, { n: LIMITS.freePhotos });
    $("plusPhotos").textContent = fill(t.photoN, { n: LIMITS.plusPhotos });
    $("freeVideos").textContent = fill(t.videoN, { n: LIMITS.freeVideos });
    $("plusVideos").textContent = fill(t.videoN, { n: LIMITS.plusVideos });
    $("freeDaily").textContent = fill(t.pv, { p: LIMITS.dayPhotos, v: LIMITS.dayVideos });
    $("freeMonthly").textContent = fill(t.pv, { p: LIMITS.monthPhotos, v: LIMITS.monthVideos });
    t.soon.forEach((s) => { const li = document.createElement("li"); li.textContent = s; $("soon").appendChild(li); });
    $("fine").innerHTML = "";
    $("fine").append(fill(t.fine, { store }), document.createElement("br"));
    for (const [href, key] of [["terms", "terms"], ["privacy", "privacy"]]) {
      const a = document.createElement("a"); a.href = href; a.textContent = t[key];
      // 앱 안에서는 앱이 밖의 브라우저로 연다(웹뷰에는 뒤로 가기가 없다).
      a.onclick = (e) => { if (inApp) { e.preventDefault(); toApp({ type: "open", url: a.href }); } };
      $("fine").append(a, " · ");
    }
    $("fine").lastChild.remove();


    let state = { member: false, canPurchase: false, busy: false, products: [] };
    let selected = PRODUCTS[0];

    function toast(text) {
      const el = $("toast");
      el.textContent = text; el.classList.add("show");
      clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2800);
    }

    function formatDate(iso) {
      return new Intl.DateTimeFormat(lang, { year: "numeric", month: "long", day: "numeric" }).format(new Date(iso));
    }

    function render() {
      const member = state.member;
      $("status").hidden = !member;
      if (member) {
        const date = formatDate(state.expiresAt);
        const line = state.willRenew ? fill(t.renews, { date }) : fill(t.ends, { date });
        $("statusLine").textContent = state.mine ? line : `${t.byPartner} ${fill(t.until, { date })}`;
      }
      // 가입 중이면 가입 영역 대신 구독 관리(내가 가입했을 때만, 상대 것은 상대 기기에서 관리).
      $("buy").hidden = member || !inApp;
      $("manage").hidden = !(member && state.mine && inApp);
      $("restore").hidden = member || !inApp;
      $("outside").hidden = inApp;

      const plans = $("plans");
      plans.innerHTML = "";
      for (const id of PRODUCTS) {
        const product = state.products.find((p) => p.id === id);
        const yearly = id.endsWith("yearly");
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "plan"; btn.setAttribute("role", "radio");
        btn.setAttribute("aria-checked", String(selected === id));
        btn.disabled = !product;
        btn.innerHTML = `<span class="dot"></span><span class="name"></span><span class="price"></span>`;
        btn.querySelector(".name").textContent = yearly ? t.yearly : t.monthly;
        if (yearly) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = t.best; btn.querySelector(".name").append(tag); }
        btn.querySelector(".price").textContent = product ? `${product.price} ${yearly ? t.perYear : t.perMonth}` : "—";
        btn.onclick = () => { selected = id; render(); };
        plans.appendChild(btn);
      }
      const available = state.canPurchase && state.products.some((p) => p.id === selected);
      $("purchase").disabled = !available || state.busy;
      $("purchase").textContent = state.busy ? t.joining : t.join;
      $("restore").disabled = !state.canPurchase || state.busy;
      if (inApp && state.ready && !state.canPurchase && !member) $("purchase").textContent = t.noStore;
    }

    $("purchase").onclick = () => toApp({ type: "purchase", productId: selected });
    $("restore").onclick = () => toApp({ type: "restore" });
    $("manage").onclick = () => toApp({ type: "manage" });

    window.dearlove = {
      receive(message) {
        if (message.type === "state") {
          state = { ...message, ready: true };
          if (!state.products.some((p) => p.id === selected) && state.products[0]) selected = state.products[0].id;
          render();
        } else if (message.type === "result") {
          // reason: purchased · restored · nothing(복원할 구독 없음) · cancelled · failed
          toast({ purchased: t.done, restored: t.restored, nothing: t.nothing, cancelled: t.cancelled }[message.reason] ?? t.failed);
        }
      },
    };

    render();
    toApp({ type: "ready" });
  </script>
</body>
</html>
